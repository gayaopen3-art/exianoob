# Build the Arkari (goron-based LLVM obfuscator) clang for a SELECTED branch and upload it.
#
# Arkari is a FULL LLVM monorepo: all obfuscation passes are compiled INTO clang, so the build
# needs no flag/NDK choices. You enable obfuscation later, at COMPILE time, with -mllvm flags
# (e.g. -mllvm -irobf -mllvm -irobf-cse ...).
#
# TARGET selects what kind of clang binary you get:
#   * linux-x86_64   -> runs on Ubuntu/PC, emits arm64 (drop into an NDK). ORIGINAL behavior.
#   * termux-arm64   -> runs ON an arm64 Android phone under Termux, emits arm64. Cross-compiled
#                       on the same Ubuntu runner against the Android NDK (Bionic, static libc++).
#   * windows-x86_64 -> runs on Windows (MSVC, static runtime), emits arm64/x86. Built on a
#                       windows-latest runner; drop into a Windows NDK (llvm-19.x -> NDK r28x).
#
# Match the LLVM major to your NDK when installing into an NDK:
#   llvm-18.x -> NDK r27c (clang 18) ,  llvm-19.x -> r28c (clang 19) ,  llvm-21.x -> r29 (clang 21).
name: build-arkari-select

on:
  workflow_dispatch:
    inputs:
      obf_branch:
        description: "Arkari branch (LLVM version) to build"
        type: choice
        default: llvm-21.x
        options:
          - llvm-23.x
          - llvm-22.x
          - llvm-21.x
          - llvm-20.x
          - llvm-19.x
          - llvm-18.x
          - llvm-17.x
          - llvm-16.x
          - llvm-15.x
          - llvm-14.x
      target:
        description: "Output platform: where the produced clang RUNS"
        type: choice
        default: linux-x86_64
        options:
          - linux-x86_64
          - termux-arm64
          - windows-x86_64
      runner:
        description: "Build machine (windows-x86_64 ignores this and always uses windows-latest)"
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-22.04
          - self-hosted

env:
  NDK_VERSION: r27c
  ANDROID_API: "24"

jobs:
  build:
    # Windows target must build on a Windows runner; other targets use the chosen (ubuntu) runner.
    runs-on: ${{ inputs.target == 'windows-x86_64' && 'windows-latest' || inputs.runner }}
    timeout-minutes: 570
    steps:
      - name: Free up disk space (Linux)
        if: ${{ inputs.target != 'windows-x86_64' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Free up disk space (Windows)
        if: ${{ inputs.target == 'windows-x86_64' }}
        shell: pwsh
        run: |
          # Biggest space hogs on windows-latest that an LLVM build does not need.
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\CodeQL" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:AGENT_TOOLSDIRECTORY\go" -ErrorAction SilentlyContinue
          Get-PSDrive C | Select-Object Used,Free

      - name: Install build deps (Linux)
        if: ${{ inputs.target != 'windows-x86_64' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build ccache lld clang python3 git binutils curl unzip xz-utils

      - name: Checkout selected Arkari branch (shallow)
        uses: actions/checkout@v4
        with:
          repository: komimoe/Arkari
          ref: ${{ inputs.obf_branch }}
          submodules: false
          fetch-depth: 1

      - name: Cache ccache (Linux)
        if: ${{ inputs.target != 'windows-x86_64' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-arkari-${{ inputs.obf_branch }}-${{ inputs.target }}-${{ github.sha }}
          restore-keys: |
            ccache-arkari-${{ inputs.obf_branch }}-${{ inputs.target }}-

      # ---------------------------------------------------------------------------
      # PATH C: native Windows x86_64 clang (MSVC)  ->  drop into a Windows NDK
      # ---------------------------------------------------------------------------
      - name: Setup MSVC developer environment (windows-x86_64)
        if: ${{ inputs.target == 'windows-x86_64' }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install vcpkg deps (windows-x86_64)
        if: ${{ inputs.target == 'windows-x86_64' }}
        shell: pwsh
        run: |
          # The VS-bundled vcpkg ($env:VCPKG_ROOT -> VC/vcpkg) is manifest-mode only
          # and has no classic mode, so `vcpkg install <pkg>` fails there. Use the
          # standalone vcpkg at C:\vcpkg instead, and point CMake at ITS toolchain.
          & "C:\vcpkg\vcpkg.exe" install zlib:x64-windows-static liblzma:x64-windows-static libxml2:x64-windows-static

      - name: Configure clang build (windows-x86_64)
        if: ${{ inputs.target == 'windows-x86_64' }}
        shell: pwsh
        run: |
          cmake -G Ninja -S llvm -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_FLAGS="-DLIBXML_STATIC /utf-8 /EHsc" `
            -DCMAKE_C_FLAGS="-DLIBXML_STATIC /utf-8" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON `
            -DLLVM_ENABLE_PROJECTS="clang" `
            -DLLVM_TARGETS_TO_BUILD="AArch64;X86" `
            -DLLVM_ENABLE_LIBXML2=FORCE_ON `
            -DCLANG_ENABLE_LIBXML2=OFF `
            -DLLVM_ENABLE_RPMALLOC=OFF `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            -DLLVM_ENABLE_ASSERTIONS=OFF `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="x64-windows-static"

      - name: Build clang (windows-x86_64)
        if: ${{ inputs.target == 'windows-x86_64' }}
        shell: pwsh
        run: |
          ninja -C build clang
          .\build\bin\clang.exe --version

      # ---------------------------------------------------------------------------
      # PATH A: native Linux x86_64 clang  (original, unchanged)
      # ---------------------------------------------------------------------------
      - name: Configure clang build (linux-x86_64)
        if: ${{ inputs.target == 'linux-x86_64' }}
        run: |
          set -euxo pipefail
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_OPTIMIZED_TABLEGEN=ON \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_CCACHE_BUILD=ON \
            -DLLVM_PARALLEL_LINK_JOBS=2 \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF

      # ---------------------------------------------------------------------------
      # PATH B: cross-compile an arm64 clang that runs on Termux
      # ---------------------------------------------------------------------------
      - name: Download Android NDK (for termux-arm64 cross build)
        if: ${{ inputs.target == 'termux-arm64' }}
        run: |
          set -euxo pipefail
          curl -fsSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q ndk.zip
          echo "ANDROID_NDK=$PWD/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build native tablegen tools (host x86_64, for cross build)
        if: ${{ inputs.target == 'termux-arm64' }}
        run: |
          set -euxo pipefail
          # A cross build cannot run arm64 tablegen on the x86_64 runner, so build the
          # generators natively first and hand them to the cross configure.
          cmake -G Ninja -S llvm -B build-native \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_CCACHE_BUILD=ON
          ninja -C build-native llvm-tblgen clang-tblgen llvm-min-tblgen

      - name: Configure clang build (termux-arm64 cross)
        if: ${{ inputs.target == 'termux-arm64' }}
        run: |
          set -euxo pipefail
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DANDROID_STL=c++_static \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_HOST_TRIPLE=aarch64-linux-android${ANDROID_API} \
            -DLLVM_DEFAULT_TARGET_TRIPLE=aarch64-linux-android${ANDROID_API} \
            -DLLVM_TABLEGEN="$PWD/build-native/bin/llvm-tblgen" \
            -DCLANG_TABLEGEN="$PWD/build-native/bin/clang-tblgen" \
            -DLLVM_NATIVE_TOOL_DIR="$PWD/build-native/bin" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DLLVM_CCACHE_BUILD=ON

      # ---------------------------------------------------------------------------
      # Build (both paths)
      # ---------------------------------------------------------------------------
      - name: Build clang (Linux targets, with Arkari obfuscation compiled in)
        if: ${{ inputs.target != 'windows-x86_64' }}
        run: |
          set -euxo pipefail
          ninja -C build clang
          if [ "${{ inputs.target }}" = "linux-x86_64" ]; then
            ./build/bin/clang --version
          else
            echo "Cross-built arm64 clang (cannot run here). File type:"
            file build/bin/clang
          fi

      # ---------------------------------------------------------------------------
      # Package (Windows)
      # ---------------------------------------------------------------------------
      - name: Package obfuscating clang toolchain (Windows)
        if: ${{ always() && inputs.target == 'windows-x86_64' }}
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force dist\bin | Out-Null
          if (-not (Test-Path build\bin\clang.exe)) {
            Write-Host "::warning::clang was not built."
            exit 0
          }
          Copy-Item build\bin\clang.exe dist\bin\clang.exe
          Copy-Item build\bin\clang.exe dist\bin\clang++.exe
          # Installer: drop the obfuscating clang into a Windows NDK whose clang major
          # matches this build (llvm-19.x -> NDK r28x). Built line-by-line because a
          # PowerShell here-string closing '@ at column 0 would break the YAML block.
          $bat = @(
            '@echo off',
            'setlocal',
            'rem Install the Arkari obfuscating clang into a Windows NDK.',
            'rem Usage: install-into-ndk.bat "C:\Users\you\AppData\Local\Android\Sdk\ndk\28.2.13676358"',
            'if "%~1"=="" ( echo Pass the NDK path. ^& exit /b 1 )',
            'set "BIN=%~1\toolchains\llvm\prebuilt\windows-x86_64\bin"',
            'if not exist "%BIN%" ( echo Not an NDK toolchain bin dir: %BIN% ^& exit /b 1 )',
            'for %%f in (clang clang++) do (',
            '  if not exist "%BIN%\%%f.orig.exe" copy "%BIN%\%%f.exe" "%BIN%\%%f.orig.exe" >nul',
            '  copy /y "%~dp0bin\%%f.exe" "%BIN%\%%f.exe" >nul',
            ')',
            'echo Installed obfuscating clang into %BIN% (originals saved as *.orig.exe).',
            'echo Enable obfuscation with -mllvm flags and build at -O1+ (release, not debug).'
          )
          Set-Content -Path dist\install-into-ndk.bat -Value $bat -Encoding ascii
          $readme = @(
            'Arkari obfuscating clang  (HOST binary: x64 Windows; runs on Windows, emits arm64/x86).',
            '=====================================================================================',
            'Built with MSVC (static runtime). Install into a version-matched Windows NDK',
            '(llvm-19.x build -> NDK r28x):',
            '  install-into-ndk.bat "C:\...\android-ndk-r28x"   (restore: copy .orig.exe back)',
            '',
            'Enable obfuscation at COMPILE time (e.g. ndk-build: LOCAL_CPPFLAGS += ...):',
            '  -mllvm -irobf                 enable (required)',
            '  -mllvm -irobf-cse             C-string encryption',
            '  -mllvm -irobf-fla             control-flow flattening   (llvm-20.x uses -irobf-cff)',
            '  -mllvm -irobf-indbr           indirect branches',
            '  -mllvm -irobf-icall           indirect calls',
            '  -mllvm -irobf-indgv           indirect global refs',
            '  -mllvm -irobf-cie             integer-constant encryption',
            '  -mllvm -irobf-cfe             FP-constant encryption',
            'Passes only run at -O1 or higher. Per-function control: [[clang::annotate("+fla +cse")]].'
          )
          Set-Content -Path dist\README.txt -Value $readme -Encoding ascii
          Get-ChildItem dist\bin | Select-Object Name,Length

      # ---------------------------------------------------------------------------
      # Package (Linux / Termux)
      # ---------------------------------------------------------------------------
      - name: Package obfuscating clang toolchain
        if: ${{ always() && inputs.target != 'windows-x86_64' }}
        run: |
          set -uxo pipefail
          rm -rf dist && mkdir -p dist/bin
          if [ ! -f build/bin/clang ]; then echo "::warning::clang was not built."; exit 0; fi
          cp build/bin/clang  dist/bin/clang
          cp build/bin/clang  dist/bin/clang++

          if [ "${{ inputs.target }}" = "termux-arm64" ]; then
            # Strip the arm64 binary with the NDK's cross-capable llvm-strip.
            STRIP="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
            "$STRIP" dist/bin/clang dist/bin/clang++ 2>/dev/null || true
            # Scripts are written with printf (no heredocs): heredoc bodies/terminators would
            # have to sit at YAML column 0 and corrupt the workflow file.
            printf '%s\n' \
              '#!/data/data/com.termux/files/usr/bin/bash' \
              '# Install the Arkari obfuscating clang inside Termux.' \
              'set -euo pipefail' \
              'here="$(cd "$(dirname "$0")" && pwd)"' \
              'install -m0755 "$here/bin/clang"   "$PREFIX/bin/arkari-clang"' \
              'install -m0755 "$here/bin/clang++" "$PREFIX/bin/arkari-clang++"' \
              'echo "Installed as arkari-clang / arkari-clang++ in $PREFIX/bin."' \
              'echo "It defaults to target aarch64-linux-android. Enable obfuscation with -mllvm -irobf ..."' \
              'arkari-clang --version' \
              > dist/install-in-termux.sh
            chmod +x dist/install-in-termux.sh
            printf '%s\n' \
              'Arkari obfuscating clang  (HOST binary: arm64 Android / Termux; runs ON the phone).' \
              '==================================================================================' \
              'Built against the Android NDK (Bionic, static libc++), min API 24 (Android 7+).' \
              '' \
              'Install in Termux:' \
              '  pkg install libc++            # runtime, just in case' \
              '  ./install-in-termux.sh        # -> arkari-clang / arkari-clang++' \
              '' \
              'Default target is aarch64-linux-android, so plain "arkari-clang foo.c -O2" already' \
              'builds arm64. Enable obfuscation at COMPILE time (needs -O1+):' \
              '  -mllvm -irobf                 enable (required)' \
              '  -mllvm -irobf-cse             C-string encryption' \
              '  -mllvm -irobf-fla             control-flow flattening   (llvm-20.x uses -irobf-cff)' \
              '  -mllvm -irobf-indbr           indirect branches' \
              '  -mllvm -irobf-icall           indirect calls' \
              '  -mllvm -irobf-indgv           indirect global refs' \
              '  -mllvm -irobf-cie             integer-constant encryption' \
              '  -mllvm -irobf-cfe             FP-constant encryption' \
              'Per-function control: [[clang::annotate("+fla +cse")]].' \
              > dist/README.txt
          else
            strip dist/bin/clang dist/bin/clang++ 2>/dev/null || true
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              '# Drop the Arkari obfuscating clang into an NDK whose clang major matches this build.' \
              '# Usage: ./install-into-ndk.sh /path/to/android-ndk-rXX' \
              'set -euo pipefail' \
              'NDK="${1:?pass the NDK path, e.g. /home/you/android-ndk-r29}"' \
              'BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"' \
              '[ -d "$BIN" ] || { echo "Not an NDK toolchain bin dir: $BIN"; exit 1; }' \
              'here="$(cd "$(dirname "$0")" && pwd)"' \
              'for f in clang clang++; do' \
              '  [ -e "$BIN/$f.orig" ] || cp -a "$BIN/$f" "$BIN/$f.orig"' \
              '  install -m0755 "$here/bin/$f" "$BIN/$f"' \
              'done' \
              'echo "Installed obfuscating clang into $BIN (originals saved as clang.orig / clang++.orig)."' \
              'echo "Enable obfuscation with -mllvm flags and build at -O1+ (NOT APP_OPTIM=debug)."' \
              > dist/install-into-ndk.sh
            chmod +x dist/install-into-ndk.sh
            printf '%s\n' \
              'Arkari obfuscating clang  (HOST binary: x86_64 Linux; runs on Ubuntu, emits arm64).' \
              '================================================================================' \
              'Install into a version-matched NDK (transparent for ndk-build / CMake / gradle):' \
              '  ./install-into-ndk.sh /path/to/android-ndk-rXX      (restore: copy clang.orig back)' \
              '' \
              'Enable obfuscation at COMPILE time (e.g. ndk-build: LOCAL_CPPFLAGS += ...):' \
              '  -mllvm -irobf                 enable (required)' \
              '  -mllvm -irobf-cse             C-string encryption' \
              '  -mllvm -irobf-fla             control-flow flattening   (llvm-20.x uses -irobf-cff)' \
              '  -mllvm -irobf-indbr           indirect branches' \
              '  -mllvm -irobf-icall           indirect calls' \
              '  -mllvm -irobf-indgv           indirect global refs' \
              '  -mllvm -irobf-cie             integer-constant encryption' \
              '  -mllvm -irobf-cfe             FP-constant encryption' \
              'Passes only run at -O1 or higher. Per-function control: [[clang::annotate("+fla +cse")]].' \
              > dist/README.txt
          fi
          du -h dist/bin/* || true

      - name: Upload obfuscating clang toolchain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arkari-clang-${{ inputs.target }}-${{ inputs.obf_branch }}
          path: dist/**
          if-no-files-found: warn
